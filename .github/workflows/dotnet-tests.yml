name: CI - build, test, containerise

# Runs on every push and pull request. A change only "passes" if ALL three stages are green, so a breaking
# change is caught here, before it can be deployed:
#   1. build + unit tests          (GLMS.Tests: business rules, patterns, file checks, currency maths)
#   2. API integration tests        (GLMS.IntegrationTests: real HTTP calls to the real API + real SQL Server)
#   3. Docker: build the images, start the full system with docker compose, and run the same
#      integration tests against the RUNNING containers.
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, unit tests and API integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore GLMS.sln

      - name: Build
        run: dotnet build GLMS.sln --configuration Release --no-restore

      - name: Unit tests
        run: >
          dotnet test tests/GLMS.Tests/GLMS.Tests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      # Testcontainers starts SQL Server 2022 in Docker (available on GitHub's Ubuntu runners) and the API is
      # hosted in memory against it: migrations, seed data, JWT, controllers, EF Core all run for real.
      - name: API integration tests (real SQL Server via Testcontainers)
        run: >
          dotnet test tests/GLMS.IntegrationTests/GLMS.IntegrationTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=integration-tests.trx"
          --logger "console;verbosity=normal"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults

  docker:
    name: Docker images + system test against running containers
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the images and start sql-server-db, glms-backend-api, glms-frontend-web
        env:
          CURRENCY_MODE: Fixed
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Show container status
        run: docker compose ps

      - name: Front end is up and redirects to the login page
        run: |
          curl --fail --silent http://localhost:5000/health
          curl --silent --output /dev/null --write-out "%{http_code} %{redirect_url}\n" http://localhost:5000/ | grep "Account/Login"

      - name: Integration tests against the running API container
        env:
          GLMS_API_BASE_URL: http://localhost:5080
        run: >
          dotnet test tests/GLMS.IntegrationTests/GLMS.IntegrationTests.csproj
          --configuration Release
          --logger "console;verbosity=normal"

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Stop and remove containers
        if: always()
        run: docker compose down -v
